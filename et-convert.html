<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>et-Convert — et-Tools</title><style>
:root{color-scheme:dark;--bg:#0b1018;--panel:#172231;--line:#304056;--text:#f2f5fa;--muted:#9eacbd;--a:#b5f27b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#263d49,transparent 40%),var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px 18px 55px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:42px}.brand{font-size:23px;font-weight:900}.brand span{color:var(--a)}nav{display:flex;gap:8px}nav a{color:var(--text);text-decoration:none;background:#1c2938;border:1px solid var(--line);padding:8px 12px;border-radius:10px;font-size:13px;font-weight:700}
.eyebrow{color:var(--a);font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800}h1{font-size:clamp(36px,6vw,58px);line-height:1.05;letter-spacing:-2px;margin:10px 0}p{color:var(--muted)}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:15px;align-items:start}.panel{background:linear-gradient(145deg,#1a2737,#121b28);border:1px solid var(--line);border-radius:18px;padding:19px;min-width:0}.panel h2{font-size:17px;margin:0 0 14px}
input,select,textarea{width:100%;min-width:0;padding:11px;background:#0d1520;border:1px solid #35445a;border-radius:10px;color:var(--text);font:inherit}textarea{resize:vertical}input[type=checkbox]{width:18px;min-width:18px;height:18px;flex:0 0 18px;align-self:center;margin:0;accent-color:var(--a)}label.item{display:flex;flex-direction:row;align-items:center;gap:12px;min-width:0}label.item .itemmain{flex:1;min-width:0;overflow-wrap:anywhere}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{font-size:11px;color:var(--muted);font-weight:700;display:block;margin-bottom:5px}
button{cursor:pointer;font:inherit}.btn{border:0;background:var(--a);color:#17210f;padding:10px 14px;border-radius:10px;font-weight:850}.sub{background:#253346;color:var(--text);border:1px solid var(--line);padding:7px 10px;border-radius:9px}.danger{background:#41272d;color:#ffb4b4;border:1px solid #633b43}
.list{display:grid;gap:8px;margin-top:14px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;background:#101925;border:1px solid #2c3a4d;border-radius:12px}.itemmain{min-width:0;flex:1;overflow-wrap:anywhere}.meta{font-size:11px;color:var(--muted)}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.side{display:grid;gap:14px}.hero{font-size:27px;font-weight:850;letter-spacing:-1px}.green{background:linear-gradient(145deg,#263d34,#182a2a);border-color:#456452}.stat{font-size:30px;font-weight:900;color:var(--a)}.bar{height:8px;background:#0b1717;border-radius:8px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--a);width:0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{display:block;text-decoration:none;color:var(--text);padding:17px;background:#172333;border:1px solid var(--line);border-radius:15px;min-height:140px}.card[hidden]{display:none!important}.card:hover{border-color:var(--a);transform:translateY(-2px)}.card b{display:block;margin:8px 0}.card small{color:var(--muted)}.foot{font-size:11px;color:#74839a;margin-top:18px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#eaffd9;color:#192610;padding:9px 14px;border-radius:9px;opacity:0;transition:.2s}.toast.show{opacity:1}
@media(max-width:760px){.layout{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){header{align-items:flex-start;gap:10px;flex-wrap:wrap}nav{flex-wrap:wrap}.item{gap:8px}.itemmain{min-width:0;overflow-wrap:anywhere}.wrap{padding:16px 12px}.cards{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}header{margin-bottom:32px}h1{letter-spacing:-1px}}
</style></head><body><div class="wrap"><header><div class="brand"><span>et-</span>Convert</div><nav><a href="index.html">← Home</a><a href="et-tools.html">☷ Tool-Menü</a></nav></header><div class="eyebrow">et-Tools · Dein Alltag, einfacher</div><h1>et-Convert</h1><p>Einheiten schnell und einfach umrechnen.</p><div style="margin-top:25px"><div class="layout"><main class="panel"><h2>Einheiten umrechnen</h2><div class="form"><div class="full"><label>Kategorie</label><select id="type"><option value="length">Länge</option><option value="weight">Gewicht</option><option value="temp">Temperatur</option><option value="data">Datenmenge</option><option value="time">Zeit</option></select></div><div><label>Wert</label><input id="value" type="number" value="1" step="any"></div><div><label>Von</label><select id="from"></select></div><div class="full"><label>Nach</label><select id="to"></select></div></div></main><aside class="panel green"><div class="eyebrow">Ergebnis</div><div class="stat" id="result">—</div><p id="formula"></p></aside></div></div><div class="foot">et-Tools · Lokal im Browser gespeichert. Keine Anmeldung erforderlich.</div></div><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n);const units={length:{m:1,km:1000,cm:.01,mm:.001,ft:.3048},weight:{kg:1,g:.001,mg:.000001,lb:.45359237},data:{B:1,kB:1000,MB:1e6,GB:1e9,TB:1e12},time:{Sekunden:1,Minuten:60,Stunden:3600,Tage:86400}};function opts(){let t=$('type').value,k=t==='temp'?['°C','°F','K']:Object.keys(units[t]);$('from').innerHTML=k.map(x=>`<option>${x}</option>`).join('');$('to').innerHTML=k.map(x=>`<option>${x}</option>`).join('');if(k.length>1)$('to').selectedIndex=1;calc()}function calc(){let t=$('type').value,v=+$('value').value,f=$('from').value,to=$('to').value;if(!Number.isFinite(v))return;let r;if(t==='temp'){let c=f==='°F'?(v-32)*5/9:f==='K'?v-273.15:v;r=to==='°F'?c*9/5+32:to==='K'?c+273.15:c}else r=v*units[t][f]/units[t][to];$('result').textContent=r.toLocaleString('de-DE',{maximumFractionDigits:7})+' '+to;$('formula').textContent=v+' '+f+' → '+to} $('type').onchange=opts;['value','from','to'].forEach(x=>$(x).oninput=calc);opts();</script></body></html>
