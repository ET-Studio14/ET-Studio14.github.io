<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eigenes Rezept – ET-Kochbuch</title><style>
:root{--ink:#29233b;--muted:#6f6682;--pink:#ff77ad;--orange:#ffb45f;--lilac:#9c8cff;--mint:#8ee6d1;--paper:#fffdf9;--line:#eee5f3;--shadow:0 14px 35px #49335b18}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 10% 5%,#ffe2ee 0,transparent 28%),radial-gradient(circle at 95% 12%,#e2ddff 0,transparent 25%),#fff9f3;min-height:100vh}
a{color:inherit}.top{padding:34px 20px 44px;text-align:center;background:linear-gradient(120deg,#ff8fbd,#ffbd78 52%,#a99aff);color:#fff;position:relative;overflow:hidden}
.top:before,.top:after{content:"";position:absolute;border:2px solid #ffffff55;border-radius:50%;width:180px;height:180px;top:-90px;left:5%}.top:after{width:240px;height:240px;left:auto;right:4%;top:auto;bottom:-160px}
.brand{font-size:clamp(2.3rem,7vw,4rem);font-weight:1000;letter-spacing:-2px;text-shadow:0 4px 0 #7b4d8830;margin:0}.subtitle{margin:8px 0 0;font-weight:700}
.wrap{width:min(1000px,calc(100% - 32px));margin:28px auto 90px}.section-title{font-size:1.65rem;margin:30px 0 14px;letter-spacing:-.5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:18px}
.card,.panel{background:var(--paper);border:2px solid #fff;border-radius:24px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card:after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;background:#ffe4ef;right:-32px;top:-34px;z-index:0}.card>*{position:relative;z-index:1}
.emoji{font-size:2rem;display:inline-block;margin-bottom:8px}.card h2{margin:0 0 8px;font-size:1.25rem}.card p{color:var(--muted);line-height:1.5}.pill{display:inline-block;background:#f1eaff;color:#6650a5;border-radius:99px;padding:5px 10px;font-size:.78rem;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;border:0;border-radius:14px;padding:11px 16px;background:linear-gradient(120deg,#ff78ad,#a08cff);color:white;font:inherit;font-weight:850;cursor:pointer;box-shadow:0 5px 0 #6f55a54a;transition:transform .15s}.btn:hover{transform:translateY(-2px)}.btn.secondary{background:#eee9ff;color:#584a86;box-shadow:none}.btn.soft{background:#e5faf4;color:#27695c;box-shadow:none}
.fab{position:fixed;bottom:22px;left:22px;width:64px;height:64px;border-radius:22px;font-size:2rem;z-index:5;padding:0}
.back{display:inline-block;text-decoration:none;color:#6c5599;font-weight:800;margin:0 0 18px}
label{display:block;font-weight:850;margin:14px 0 6px}input,textarea,select{width:100%;border:2px solid #eee4f3;border-radius:13px;padding:12px;font:inherit;color:var(--ink);background:#fff}textarea{min-height:95px;resize:vertical}
.field-hint{color:var(--muted);font-size:.9rem;margin:6px 0}.ingredient-row{display:grid;grid-template-columns:95px 90px 1fr auto;gap:8px;margin:8px 0;align-items:center}.ingredient-row input{min-width:0}.remove{border:0;background:#ffe6ef;color:#9b3863;border-radius:10px;padding:10px;cursor:pointer}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.notice{padding:13px 15px;border-radius:14px;background:#e8faf4;color:#27695c;font-weight:700;margin:14px 0}
.recipe-list{padding-left:22px;line-height:1.75}.recipe-list li{padding-left:4px;margin-bottom:5px}.scaler{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#f4efff;padding:12px 15px;border-radius:15px;margin:15px 0}.scaler button{border:0;border-radius:10px;background:white;padding:7px 13px;font-size:1.1rem;cursor:pointer}
.small{font-size:.88rem;color:var(--muted)}.empty{padding:20px;border:2px dashed #d8c9e8;border-radius:18px;color:var(--muted)}
@media(max-width:560px){.ingredient-row{grid-template-columns:70px 75px 1fr auto}.ingredient-row input{padding:9px 7px}.wrap{width:min(100% - 22px,1000px)}}
</style></head>
<body>
<header class="top"><div class="brand">🧁 Dein Rezept</div><p class="subtitle">Heute wird etwas Leckeres gezaubert</p></header>
<main class="wrap"><a class="back" href="kochbuch.html">← Zurück zum Kochbuch</a><section class="panel" id="recipePanel"><p>Rezept wird geladen …</p></section></main>
<script>
const KEY='et-kochbuch-eigene-rezepte-v2';let recipe=null, servings=1;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(n){return Number.isInteger(n)?String(n):Number(n.toFixed(2)).toLocaleString('de-DE')}
function render(){
 const panel=document.getElementById('recipePanel');if(!recipe){panel.innerHTML='<h2>Rezept nicht gefunden</h2><a class="btn" href="kochbuch.html">Zur Startseite</a>';return;}
 const base=Number(recipe.baseServings)||1, factor=servings/base;
 const ing=recipe.ingredients.map(x=>{let q=x.quantity===null||x.quantity===''?'':fmt(Number(x.quantity)*factor)+(x.unit?' '+esc(x.unit):'')+' ';return `<li>${q}${esc(x.name)}</li>`}).join('');
 panel.innerHTML=`<span class="pill">Eigenes Rezept · Basis: ${base} Portion(en)</span><h1>${esc(recipe.title)}</h1><p>${esc(recipe.description)}</p><div class="scaler"><b>Portionen</b><button type="button" id="minus">−</button><strong>${servings}</strong><button type="button" id="plus">＋</button></div><h2>🛒 Zutaten</h2><ul class="recipe-list">${ing}</ul><h2>👩‍🍳 Zubereitung</h2><p style="white-space:pre-wrap;line-height:1.7">${esc(recipe.steps)}</p>${recipe.tip?`<div class="notice">💡 Tipp: ${esc(recipe.tip)}</div>`:''}`;
 panel.querySelector('#minus').addEventListener('click',()=>{servings=Math.max(1,servings-1);render()});panel.querySelector('#plus').addEventListener('click',()=>{servings=Math.min(100,servings+1);render()});
}
try{const arr=JSON.parse(localStorage.getItem(KEY)||'[]');const id=new URLSearchParams(location.search).get('id');recipe=arr.find(x=>x.id===id)||null;if(recipe)servings=Number(recipe.baseServings)||1;}catch(e){}render();
</script></body></html>
