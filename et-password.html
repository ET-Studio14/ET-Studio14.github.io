<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>et-Password — et-Tools</title><style>:root{color-scheme:dark;--bg:#0b1018;--line:#304056;--text:#f2f5fa;--muted:#9eacbd;--a:#b5f27b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#263d49,transparent 40%),var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px 18px 55px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:35px}.brand{font-size:23px;font-weight:900}.brand span,.eyebrow{color:var(--a)}nav{display:flex;gap:8px;flex-wrap:wrap}nav a,.sub{color:var(--text);text-decoration:none;background:#253346;border:1px solid var(--line);padding:8px 11px;border-radius:10px;font-size:13px;font-weight:700}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800}h1{font-size:clamp(36px,6vw,56px);line-height:1.05;letter-spacing:-2px;margin:10px 0}p{color:var(--muted)}.panel{background:linear-gradient(145deg,#1a2737,#121b28);border:1px solid var(--line);border-radius:18px;padding:19px}input,select,textarea{width:100%;min-width:0;padding:11px;margin:5px 0 12px;background:#0d1520;border:1px solid #35445a;border-radius:10px;color:var(--text);font:inherit}input[type=checkbox]{width:18px;min-width:18px;height:18px;accent-color:var(--a)}input[type=color]{height:45px;padding:4px}input[type=range]{padding:0}.btn{border:0;background:var(--a);color:#17210f;padding:10px 14px;border-radius:10px;font-weight:850;cursor:pointer}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.checks label{display:flex;align-items:center;gap:8px}.note{font-size:12px;color:var(--muted)}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:18px 0}.swatches button{border:0;border-radius:9px;padding:22px 3px;overflow-wrap:anywhere}.foot{font-size:11px;color:#74839a;margin-top:25px}canvas{max-width:100%;height:auto;display:block;margin:12px 0}#qr{margin-top:15px;background:white;display:inline-block;padding:10px;border-radius:10px}#qr img{max-width:100%;height:auto}@media(max-width:550px){.wrap{padding:16px 12px}.form{grid-template-columns:1fr}.swatches{grid-template-columns:repeat(2,1fr)}.checks{grid-template-columns:1fr}h1{letter-spacing:-1px}}</style></head><body><div class="wrap"><header><div class="brand"><span>et-</span>Password</div><nav><a href="index.html">← Home</a><a href="et-tools.html">☷ Tool-Menü</a></nav></header><div class="eyebrow">et-Tools · Dein Alltag, einfacher</div><h1>et-Password</h1><p>Sichere Zufallspasswörter direkt im Browser erzeugen</p><main class="panel"><label>Länge: <span id="n">20</span></label><input id="len" type="range" min="8" max="64" value="20"><div class="checks"><label><input id="up" type="checkbox" checked> Großbuchstaben</label><label><input id="low" type="checkbox" checked> Kleinbuchstaben</label><label><input id="num" type="checkbox" checked> Zahlen</label><label><input id="sym" type="checkbox" checked> Sonderzeichen</label></div><button class="btn" id="make">Generieren</button><input id="out" readonly><button class="sub" id="copy">Kopieren</button><p class="note">Wird nicht gespeichert oder übertragen.</p></main><div class="foot">et-Tools · Prüfe Ergebnisse vor der Verwendung.</div></div><script>const $=id=>document.getElementById(id);$('len').oninput=()=>$('n').textContent=$('len').value;function make(){let c='';if($('up').checked)c+='ABCDEFGHJKLMNPQRSTUVWXYZ';if($('low').checked)c+='abcdefghijkmnopqrstuvwxyz';if($('num').checked)c+='23456789';if($('sym').checked)c+='!@#$%^&*()-_=+[]{}?';if(!c){alert('Bitte mindestens eine Gruppe auswählen.');return}let a=new Uint32Array(+$('len').value);crypto.getRandomValues(a);$('out').value=Array.from(a,x=>c[x%c.length]).join('')} $('make').onclick=make;$('copy').onclick=()=>navigator.clipboard?.writeText($('out').value);make();</script></body></html>
