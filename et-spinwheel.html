<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101426"><title>ET Spinwheel</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;background:radial-gradient(ellipse at top,#26315d,transparent 55%),#0b1020;color:#f5f7ff;font:16px/1.5 system-ui,Arial,sans-serif}main{max-width:1050px;margin:auto}header{text-align:center;margin-bottom:24px}.tag{color:#aaa0ff;font-weight:800;letter-spacing:.2em;font-size:.75rem}h1{font-size:clamp(2.2rem,7vw,3.5rem);margin:5px 0}.sub,.muted{color:#a8b2cc}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start}.panel{background:#141b30;border:1px solid #293451;border-radius:20px;padding:20px;box-shadow:0 16px 45px #0004}.wheelWrap{position:relative;width:min(100%,520px);aspect-ratio:1;margin:0 auto 15px}.wheelWrap canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 12px 22px #0008)}.pointer{position:absolute;z-index:2;top:-5px;left:50%;transform:translateX(-50%);border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid white}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:#fff;border:8px solid #263250}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}button{font:inherit;font-weight:750;border:0;border-radius:11px;padding:11px 15px;cursor:pointer;background:#263250;color:#e9edff}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:linear-gradient(135deg,#8b7cff,#5d72ef);color:white}textarea{width:100%;min-height:210px;resize:vertical;background:#0c1325;color:white;border:1px solid #34415f;border-radius:11px;padding:12px;font:inherit;outline:none}textarea:focus{border-color:#9a8cff}.result{margin-top:18px;padding:15px;text-align:center;background:#202a49;border:1px solid #394a77;border-radius:15px}.result small{display:block;color:#b7c3e5;letter-spacing:.13em;text-transform:uppercase;font-size:.7rem;font-weight:800}#winner{font-size:clamp(1.5rem,4vw,2.3rem);font-weight:900;overflow-wrap:anywhere}.meta{display:flex;justify-content:space-between;color:#a8b2cc;font-size:.85rem;margin:9px 0}.check{display:flex;align-items:center;gap:8px;color:#a8b2cc;margin-top:14px}input{accent-color:#8b7cff}footer{text-align:center;color:#7985a4;font-size:.8rem;margin-top:24px}@media(max-width:780px){.layout{grid-template-columns:1fr}.panel{padding:16px}}

/* Navigation buttons */
.et-nav{position:absolute;top:18px;right:18px;display:flex;gap:8px;z-index:20}
.et-nav a{display:inline-block;padding:9px 13px;border:1px solid #394a77;border-radius:10px;background:#202a49;color:#f5f7ff;text-decoration:none;font:700 14px/1.2 system-ui,Arial,sans-serif}
.et-nav a:hover{background:#303d65;border-color:#8b7cff}

</style></head><body>
<nav class="et-nav" aria-label="Seitennavigation"><a href="index.html">⌂ Home</a><a href="et-tools.html">Toolmenu</a></nav><main><header><div class="tag">ET TOOLS</div><h1>ET Spinwheel</h1><div class="sub">Einträge hinzufügen, Rad drehen und überraschen lassen.</div></header>
<div class="layout"><section class="panel"><div class="wheelWrap"><div class="pointer"></div><canvas id="wheel" width="900" height="900" aria-label="Glücksrad"></canvas><div class="hub"></div></div><div class="actions"><button class="primary" id="spin">Drehen!</button><button id="mix">Mischen</button></div><div class="result" aria-live="polite"><small>Das Ergebnis</small><div id="winner">Wer wird gewinnen?</div></div></section>
<section class="panel"><h2>Deine Felder</h2><p class="muted">Jeder Eintrag in einer eigenen Zeile wird ein Feld auf dem Glücksrad.</p><textarea id="entries" aria-label="Einträge">Pizza
Burger
Sushi
Pasta
Tacos
Salat</textarea><div class="meta"><span id="count">6 Felder</span><span>Maximal 40 Felder</span></div><div class="actions"><button id="update">Rad aktualisieren</button><button id="sample">Beispiele laden</button></div><label class="check"><input type="checkbox" id="sound" checked> Sound beim Drehen und beim Ergebnis</label></section></div><footer>ET Spinwheel · Ein Tool von ET Tools</footer></main>
<script>
(()=>{const canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d"),ta=document.getElementById("entries"),winner=document.getElementById("winner"),spin=document.getElementById("spin"),colors=["#7668f2","#28b8a8","#f2a84b","#e76d91","#4d91e8","#9b70d6","#d6a83e","#36a5bc","#d36b55","#648b68"];let items=[],angle=0,busy=false,audio=null;const C=450,R=420,T=Math.PI*2;
function draw(){ctx.clearRect(0,0,900,900);if(!items.length)return;let arc=T/items.length;items.forEach((v,i)=>{let a=angle+i*arc-Math.PI/2;ctx.beginPath();ctx.moveTo(C,C);ctx.arc(C,C,R,a,a+arc);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle="#10182b";ctx.lineWidth=5;ctx.stroke();ctx.save();ctx.translate(C,C);ctx.rotate(a+arc/2);ctx.textAlign="right";ctx.textBaseline="middle";ctx.fillStyle="white";ctx.font=`800 ${Math.max(17,Math.min(31,330/items.length))}px system-ui`;let label=v.length>23?v.slice(0,21)+"…":v;ctx.shadowColor="#0007";ctx.shadowBlur=4;ctx.fillText(label,R-34,0,R*.67);ctx.restore()});ctx.beginPath();ctx.arc(C,C,R,0,T);ctx.lineWidth=12;ctx.strokeStyle="#e8eaff";ctx.stroke()}
function update(){items=ta.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).slice(0,40);document.getElementById("count").textContent=items.length+" "+(items.length===1?"Feld":"Felder");winner.textContent=items.length?"Wer wird gewinnen?":"Bitte Einträge hinzufügen";draw()}
function beep(freq=600,duration=.08,volume=.04){if(!document.getElementById("sound").checked)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
function chosen(){let arc=T/items.length,pointer=(T-(angle%T))%T;return Math.floor(pointer/arc)%items.length}
function start(){if(busy||!items.length)return;busy=true;spin.disabled=true;winner.textContent="Das Rad dreht sich …";let from=angle,extra=T*(5+Math.random()*4)+Math.random()*T,duration=5200,start=performance.now(),last=-1;function frame(now){let t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,4);angle=from+extra*ease;draw();let tick=Math.floor((angle%T)*items.length/T*2);if(tick!==last){beep(430+(tick%4)*85,.035,.018);last=tick}if(t<1)requestAnimationFrame(frame);else{busy=false;spin.disabled=false;winner.textContent=items[chosen()]||"—";beep(880,.18,.07);setTimeout(()=>beep(1175,.2,.06),120)}}requestAnimationFrame(frame)}
document.getElementById("update").onclick=update;document.getElementById("sample").onclick=()=>{ta.value="Pizza\nBurger\nSushi\nPasta\nTacos\nSalat";update()};document.getElementById("spin").onclick=start;document.getElementById("mix").onclick=()=>{if(busy)return;items.sort(()=>Math.random()-.5);ta.value=items.join("\n");winner.textContent="Reihenfolge gemischt";update()};ta.addEventListener("input",update);update();
})();
</script></body></html>
