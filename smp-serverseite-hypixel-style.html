<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c35">
  <title>GOONSMP</title>
  <style>
    :root {
      --navy: #101c35;
      --navy-deep: #091326;
      --blue: #1976d2;
      --blue-light: #42b7ff;
      --gold: #ffcc55;
      --white: #f4f8ff;
      --muted: #a9bbd5;
      --line: rgba(255,255,255,.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(ellipse at 50% -15%, rgba(42,137,220,.34), transparent 55%),
        linear-gradient(180deg, #142849 0%, var(--navy-deep) 70%);
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .16;
      background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }
    .wrap { position: relative; width: min(1050px, 92%); margin: auto; padding: 55px 0 70px; }
    header { text-align: center; margin-bottom: 35px; }
    .server-label {
      display: inline-block; padding: 7px 14px; border: 1px solid #5ebcff66;
      background: #1260a544; color: #9bdcff; border-radius: 4px;
      font-size: .75rem; font-weight: 900; letter-spacing: .18em; text-transform: uppercase;
    }
    h1 {
      margin: 17px 0 18px; font-size: clamp(2.8rem, 9vw, 6rem);
      line-height: .98; letter-spacing: -.045em; font-weight: 1000;
      text-transform: uppercase; color: #fff;
      text-shadow: 0 4px 0 #164b83, 0 8px 24px #0009;
      overflow-wrap: anywhere;
    }
    .ip-bar {
      display: inline-flex; align-items: center; justify-content: center; gap: 0;
      padding: 5px; background: #071326; border: 1px solid #4caeff66;
      border-radius: 6px; box-shadow: 0 8px 24px #0005;
    }
    .ip-caption { color: #8eaccb; padding: 0 12px; font-size: .76rem; font-weight: 900; letter-spacing: .1em; }
    #serverIp { color: var(--gold); font-weight: 900; padding: 9px 10px; font-family: Consolas, monospace; }
    button, select { font: inherit; }
    button {
      border: 0; border-radius: 4px; padding: 10px 15px; cursor: pointer;
      color: #071629; background: linear-gradient(#ffe18a, #f4b936);
      box-shadow: 0 3px 0 #a66c13; font-weight: 1000; text-transform: uppercase;
      transition: filter .15s, transform .15s;
    }
    button:hover { filter: brightness(1.1); transform: translateY(-1px); }
    button:active { transform: translateY(2px); box-shadow: 0 1px 0 #a66c13; }
    #copyStatus { display: block; min-height: 20px; margin-top: 11px; color: #8ff0b0; font-size: .85rem; font-weight: 800; }
    .panel {
      margin-top: 22px; padding: 23px;
      background: linear-gradient(145deg, rgba(26,48,82,.97), rgba(13,27,50,.98));
      border: 1px solid #4c86bd66; border-top: 3px solid var(--blue-light);
      border-radius: 7px; box-shadow: 0 14px 38px #0005;
    }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 15px; flex-wrap: wrap; }
    h2 { margin: 0; font-size: 1.45rem; font-weight: 1000; text-transform: uppercase; letter-spacing: .025em; }
    .sub { margin: 6px 0 0; color: var(--muted); font-size: .9rem; }
    .sort { display: flex; align-items: center; gap: 9px; color: #b9cce4; font-size: .9rem; font-weight: 700; }
    select {
      min-width: 145px; padding: 10px 12px; color: white; background: #0a1930;
      border: 1px solid #4c86bd88; border-radius: 4px; cursor: pointer;
    }
    .table-scroll { overflow-x: auto; margin-top: 20px; }
    table { width: 100%; min-width: 560px; border-collapse: collapse; }
    th { padding: 13px 12px; color: #9fc8ec; background: #0b1a30; font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; }
    td { padding: 14px 12px; border-bottom: 1px solid var(--line); }
    th:not(:first-child), td:not(:first-child) { text-align: right; }
    tbody tr:nth-child(even) { background: #ffffff08; }
    tbody tr:hover { background: #2589d522; }
    .rank { width: 65px; color: var(--gold); font-weight: 1000; }
    .player { font-weight: 900; }
    .empty { padding: 24px; text-align: center !important; color: var(--muted); }
    .notice-list { display: grid; gap: 12px; margin-top: 19px; }
    .notice {
      padding: 15px 17px; background: #0a172b; border: 1px solid #ffffff12;
      border-left: 4px solid var(--gold); border-radius: 4px;
    }
    .notice strong { display: block; margin-bottom: 6px; color: var(--gold); font-size: 1rem; }
    .notice div { color: #e1eaf7; line-height: 1.5; }
    .notice small { display: block; margin-top: 8px; color: #8fa9c8; font-weight: 700; }
    footer { margin-top: 30px; text-align: center; color: #7188a8; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
    @media (max-width: 580px) {
      .wrap { padding-top: 38px; }
      .panel { padding: 17px 14px; }
      .ip-bar { flex-wrap: wrap; }
      .ip-caption { padding-left: 8px; }
      #serverIp { padding: 8px 6px; }
      .section-head { align-items: flex-start; }
      .sort { width: 100%; justify-content: space-between; }
      select { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="server-label">✦ Willkommen auf unserem Server ✦</div>
      <h1 id="serverName">GOONSMP</h1>
      <div class="ip-bar">
        <span class="ip-caption">SERVER-IP</span>
        <span id="serverIp">GoonSMP2627.aternos.me</span>
        <button id="copyIp" type="button">Kopieren</button>
      </div>
      <span id="copyStatus" aria-live="polite"></span>
    </header>

    <section class="panel">
      <div class="section-head">
        <div>
          <h2>🏆 Spieler-Rangliste</h2>
          <p class="sub">Die besten Spieler unseres Servers</p>
        </div>
        <label class="sort">Sortieren nach:
          <select id="sortBy" aria-label="Rangliste sortieren">
            <option value="money">Geld</option>
            <option value="kills">Kills</option>
            <option value="deaths">Deaths</option>
            <option value="name">Name (A–Z)</option>
          </select>
        </label>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Platz</th><th>Spieler</th><th>Geld</th><th>Kills</th><th>Deaths</th></tr></thead>
          <tbody id="leaderboard"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div>
        <h2>📌 Schwarzes Brett</h2>
        <p class="sub">Events, Aktionen und wichtige Server-News</p>
      </div>
      <div class="notice-list" id="notices"></div>
    </section>

    <footer>Dein SMP · Viel Spaß beim Spielen!</footer>
  </main>

  <script>
    // =========================================================
    // SERVER-EINSTELLUNGEN: Name und IP hier ändern
    // =========================================================
    const SERVER_NAME = "GOONSMP";
    const SERVER_IP = "GoonSMP2627.aternos.me";

    // =========================================================
    // SPIELER-RANGLISTE: Hier Spieler-Daten eintragen
    // Pro Spieler: name, money, kills, deaths
    // =========================================================
    const PLAYERS = [
      { name: "VexLOL05", money: 227.44, kills: 0, deaths: 1 },
      { name: "NTM_NOAH", money: 468.08, kills: 0, deaths: 3 },
      { name: "NoChickenAh", money: 806.069999999999, kills: 0, deaths: 1 },
      { name: "Xsathor", money: 0.01, kills: 0, deaths: 0 }
    ];

    // =========================================================
    // SCHWARZES BRETT: Aktionen und News hier eintragen
    // Pro Eintrag: title, date, text
    // =========================================================
    const NOTICES = [
      { title: "Willkommen", date: "17.11.2026", text: "Die ware Version des Servers kommt diesesmal klappt alles!" }
    ];

    const $ = (id) => document.getElementById(id);
    const safeText = (value) => String(value).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));

    function renderPlayers() {
      const key = $("sortBy").value;
      const sorted = [...PLAYERS].sort((a, b) => {
        if (key === "name") return String(a.name).localeCompare(String(b.name), "de");
        if (key === "deaths") {
  return Number(a.deaths) - Number(b.deaths);
}
return Number(b[key]) - Number(a[key]);
      });
      $("leaderboard").innerHTML = sorted.length ? sorted.map((p, i) => `
        <tr>
          <td class="rank">#${i + 1}</td>
          <td class="player">${safeText(p.name)}</td>
          <td>${Number(p.money).toLocaleString("de-DE")}$</td>
          <td>${Number(p.kills)}</td>
          <td>${Number(p.deaths)}</td>
        </tr>`).join("") : '<tr><td class="empty" colspan="5">Noch keine Spieler eingetragen.</td></tr>';
    }

    function renderNotices() {
      $("notices").innerHTML = NOTICES.length ? NOTICES.map(n => `
        <article class="notice">
          <strong>${safeText(n.title)}</strong>
          <div>${safeText(n.text)}</div>
          <small>${safeText(n.date)}</small>
        </article>`).join("") : '<p class="sub">Aktuell gibt es keine neuen Einträge.</p>';
    }

    $("serverName").textContent = SERVER_NAME;
    $("serverIp").textContent = SERVER_IP;
    $("sortBy").addEventListener("change", renderPlayers);

    // Kopiert die IP direkt per Klick. Fallback funktioniert auch ohne Clipboard-API.
    $("copyIp").addEventListener("click", async () => {
      let copied = false;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(SERVER_IP);
          copied = true;
        } else {
          const helper = document.createElement("textarea");
          helper.value = SERVER_IP;
          helper.setAttribute("readonly", "");
          helper.style.position = "fixed";
          helper.style.opacity = "0";
          helper.style.pointerEvents = "none";
          document.body.appendChild(helper);
          helper.select();
          copied = document.execCommand("copy");
          helper.remove();
        }
      } catch { copied = false; }

      $("copyStatus").textContent = copied
        ? "✓ Server-IP wurde kopiert!"
        : "Kopieren nicht möglich – bitte Browser-Berechtigungen prüfen.";
      setTimeout(() => $("copyStatus").textContent = "", 2800);
    });

    renderPlayers();
    renderNotices();
  </script>
</body>
</html>
