<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ET Clock</title><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d33;--panel2:#1d2945;--line:#344260;--text:#f4f7ff;--muted:#aab6d1;--accent:#70e1c1;--blue:#78a7ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1a2a4a 0%,var(--bg) 60%);color:var(--text);font:16px system-ui,Segoe UI,sans-serif;padding:22px}
main{max-width:900px;margin:26px auto}.topnav{max-width:900px;margin:0 auto;display:flex;gap:10px;justify-content:flex-start}.topnav a{color:var(--text);text-decoration:none;background:#202c47;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:650}.topnav a:hover{border-color:var(--accent);background:#293956}
h1{text-align:center;font-size:clamp(2rem,5vw,3.2rem);margin:18px 0 6px} .sub{text-align:center;color:var(--muted);margin:0 0 26px}
.panel{background:linear-gradient(145deg,var(--panel),#11192c);border:1px solid var(--line);border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 14px 40px #0003}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
button,select,textarea{font:inherit}button{border:0;border-radius:13px;padding:12px 18px;background:var(--accent);color:#071a18;font-weight:800;cursor:pointer}button.secondary{background:#2a3958;color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.45;cursor:not-allowed}
.display{font-size:clamp(2rem,8vw,4rem);font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:1px;margin:14px 0}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}.row>*{margin:3px}
select,textarea{background:#0c1427;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}textarea{width:100%;min-height:150px;resize:vertical}
.tapbox{min-height:240px;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#1a3150,#17213a);border:2px dashed #7185ad;border-radius:20px;cursor:pointer;user-select:none;touch-action:manipulation;padding:20px}.tapbox:active{transform:scale(.995);border-color:var(--accent)}
.bigcount{font-size:clamp(3rem,12vw,6rem);font-weight:900;line-height:1}.stats{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;text-align:center}.stats strong{display:block;font-size:1.5rem}
#wheel{width:min(78vw,420px);height:min(78vw,420px);border-radius:50%;border:8px solid #e9eefc;box-shadow:0 10px 35px #0007;margin:15px auto;position:relative;background:conic-gradient(#70e1c1 0 60deg,#78a7ff 60deg 120deg,#f6c76a 120deg 180deg,#d18cff 180deg 240deg,#ff8f9c 240deg 300deg,#70e1c1 300deg 360deg)}
.pointer{width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:32px solid #fff;margin:0 auto -8px;position:relative;z-index:2;filter:drop-shadow(0 3px 3px #0008)}
.winner{font-size:clamp(1.5rem,5vw,2.4rem);font-weight:900;text-align:center;color:var(--accent);min-height:1.5em}
@media(max-width:520px){body{padding:14px}.panel{padding:16px}.topnav a{flex:1;text-align:center}}
</style></head><body>
<nav class="topnav">
  <a href="index.html">⌂ Home</a>
  <a href="et-tools.html">▦ Toolmenu</a>
</nav>
<main><h1>ET Clock</h1><p class="sub">Uhr, Timer und Stoppuhr</p>
<section class="panel"><div class="muted" style="text-align:center">Lokale Uhrzeit</div><div class="display" id="clock">--:--:--</div><div id="date" style="text-align:center"></div><div id="zone" class="muted" style="text-align:center;margin-top:5px"></div><div class="row" style="margin-top:14px"><label><input type="checkbox" id="format"> 12-Stunden-Format</label></div></section>
<div class="grid"><section class="panel"><h2>Timer</h2><div class="row"><select id="preset"><option value="600">10 Minuten</option><option value="1200">20 Minuten</option><option value="1800">30 Minuten</option><option value="3600">60 Minuten</option></select></div><div id="timer" class="display" role="button" tabindex="0" title="Zum Starten oder Pausieren drücken">10:00</div><p class="muted" style="text-align:center">Auf die Zeit drücken: Start / Pause</p><div class="row"><button class="secondary" id="resetTimer">Zurücksetzen</button></div></section>
<section class="panel"><h2>Stoppuhr</h2><div id="stopwatch" class="display" role="button" tabindex="0" title="Zum Starten oder Stoppen drücken">00:00.0</div><p class="muted" style="text-align:center">Auf die Anzeige drücken: Start / Stopp</p><div class="row"><button class="secondary" id="resetWatch">Zurücksetzen</button></div></section></div></main>
<script>
const $=id=>document.getElementById(id);let timerTotal=600,timerLeft=600,timerRunning=false,timerStart=0,watchRunning=false,watchStart=0,watchElapsed=0;
function clockTick(){let d=new Date();$('clock').textContent=d.toLocaleTimeString('de-DE',{hour12:$('format').checked});$('date').textContent=d.toLocaleDateString('de-DE',{weekday:'long',year:'numeric',month:'long',day:'numeric'});$('zone').textContent='Zeitzone: '+Intl.DateTimeFormat().resolvedOptions().timeZone;}
$('format').onchange=clockTick;clockTick();setInterval(clockTick,250);
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function timerRender(){$('timer').textContent=fmt(timerLeft)}
function timerToggle(){if(timerRunning){timerLeft=Math.max(0,timerLeft-(Date.now()-timerStart)/1000);timerRunning=false;}else if(timerLeft>0){timerStart=Date.now();timerRunning=true;}timerRender();}
$('timer').onclick=timerToggle;$('timer').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();timerToggle()}};
$('preset').onchange=()=>{timerRunning=false;timerTotal=Number($('preset').value);timerLeft=timerTotal;timerRender()};
$('resetTimer').onclick=()=>{timerRunning=false;timerLeft=timerTotal;timerRender()};
function watchRender(){let t=watchElapsed+(watchRunning?(Date.now()-watchStart)/1000:0);let m=Math.floor(t/60),s=Math.floor(t%60),d=Math.floor(t*10%10);$('stopwatch').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+d}
function watchToggle(){if(watchRunning){watchElapsed+=(Date.now()-watchStart)/1000;watchRunning=false}else{watchStart=Date.now();watchRunning=true}watchRender()}
$('stopwatch').onclick=watchToggle;$('stopwatch').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();watchToggle()}};$('resetWatch').onclick=()=>{watchRunning=false;watchElapsed=0;watchRender()};
setInterval(()=>{if(timerRunning){timerLeft=Math.max(0,timerLeft-(Date.now()-timerStart)/1000);timerStart=Date.now();if(timerLeft<=0){timerRunning=false;timerLeft=0}timerRender()}if(watchRunning)watchRender()},100);
</script></body></html>
